plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartcodejo.tvlock'
    compileSdk 35

    signingConfigs {
        tvlock {
            // If the CI provides a private key (GitHub Secrets), use it; otherwise fall back to the legacy key.
            def pass = System.getenv('TVLOCK_KS_PASS')
            def priv = file('private.keystore')
            if (pass && priv.exists()) {
                storeFile priv
                storePassword pass
                keyAlias System.getenv('TVLOCK_KS_ALIAS') ?: 'tvlock'
                keyPassword pass
            } else {
                storeFile file('tvlock.keystore')
                storePassword 'tvlockHKS2026'
                keyAlias 'tvlock'
                keyPassword 'tvlockHKS2026'
            }
        }
    }

    defaultConfig {
        applicationId 'com.smartcodejo.tvlock'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.0.18'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tvlock
        }
        release {
            signingConfig signingConfigs.tvlock
            minifyEnabled false
        }
    }
}
