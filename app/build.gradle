plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartcodejo.tvlock'
    compileSdk 35

    signingConfigs {
        tvlock {
            storeFile file('tvlock.keystore')
            storePassword 'tvlockHKS2026'
            keyAlias 'tvlock'
            keyPassword 'tvlockHKS2026'
        }
    }

    defaultConfig {
        applicationId 'com.smartcodejo.tvlock'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tvlock
        }
        release {
            signingConfig signingConfigs.tvlock
            minifyEnabled false
        }
    }
}
